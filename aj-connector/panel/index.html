<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AJ Connect Panel</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EEF2F7">
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<style>
/* ============================================================
   AJ Connect Panel — a full-screen app, not a page.

   Deliberately NOT using the site's stylesheet, nav or footer. This is a tool
   someone keeps open beside Revit while they work, so it fills the window, never
   scrolls as a whole, and shows state at a glance. It is styled to match the
   panel AJ Connect serves locally, so the two feel like one product.
   ============================================================ */

:root{
  --ground:#EEF2F7; --surface:#FFF; --surface2:#F7F9FC; --sunken:#E4EAF2;
  --line:#D3DCE8; --ink:#0E1620; --ink2:#46566B; --ink3:#7A8AA0;
  --accent:#1F76FF; --accent-deep:#0B4CC4; --wash:#E7F0FF;
  --ok:#0E9B57; --ok-wash:#E3F6EC; --stop:#C8342B; --stop-wash:#FBE7E5;
  --warn:#B4700A; --warn-wash:#FBF0DC;
  --ui:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'Cascadia Mono',Consolas,ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#0A1017; --surface:#141C26; --surface2:#1A2430; --sunken:#0F1720;
    --line:#273343; --ink:#E6EDF6; --ink2:#9FB0C4; --ink3:#6C7E94;
    --accent:#4E93FF; --accent-deep:#7FB2FF; --wash:#14243D;
    --ok:#3FCB86; --ok-wash:#10281E; --stop:#F0685E; --stop-wash:#2E1614;
    --warn:#E0A53F; --warn-wash:#2A2113;
  }
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--ui);font-size:14px;line-height:1.5;
  display:flex;flex-direction:column;overflow:hidden;   /* the app never scrolls as a whole */
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- header ---------- */
.top{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex:none;
}
.brand{display:flex;align-items:center;gap:10px}
.mark{
  width:30px;height:30px;border-radius:8px;flex:none;
  background:linear-gradient(150deg,var(--accent),var(--accent-deep));
  color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;
}
.bname{font-size:15px;font-weight:700;line-height:1.15}
.bsub{display:block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}

.facts{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-left:auto}
.pill{
  display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
  font-size:12px;font-weight:600;background:var(--sunken);color:var(--ink3);
}
.pill.ok{background:var(--ok-wash);color:var(--ok)}
.pill.warn{background:var(--warn-wash);color:var(--warn)}
.pill.bad{background:var(--stop-wash);color:var(--stop)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.fact{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.fk{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.fv{font-size:12.5px;font-weight:600;font-family:var(--mono);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:190px}

/* ---------- toolbar ---------- */
.bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:none;
  padding:10px 18px;background:var(--surface2);border-bottom:1px solid var(--line);
}
.seek{
  display:flex;align-items:center;gap:8px;flex:1;min-width:170px;max-width:420px;
  padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:9px;
}
.seek:focus-within{border-color:var(--accent)}
.seek input{flex:1;min-width:0;border:0;background:transparent;padding:8px 0}
.seek input:focus{outline:none}
.mini{
  padding:8px 13px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface);color:var(--ink2);font-size:12.5px;cursor:pointer;white-space:nowrap;
}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.mini.danger:hover{border-color:var(--stop);color:var(--stop)}

/* ---------- tools ---------- */
.main{flex:1;overflow-y:auto;padding:16px 18px;min-height:0}   /* only this scrolls */
.gname{
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);margin:0 0 9px;
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;margin-bottom:20px}
.tool{
  display:flex;flex-direction:column;gap:5px;padding:12px 13px;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:11px;
  transition:transform .13s,border-color .13s;
}
.tool[data-live="1"]{cursor:pointer}
.tool[data-live="1"]:hover{transform:translateY(-2px);border-color:var(--accent)}
.tool[data-live="0"]{opacity:.55}
.tool:disabled{opacity:.45;cursor:wait}
.tname{font-size:13.5px;font-weight:600}
.tdesc{font-size:11.5px;color:var(--ink3);line-height:1.4}
.empty{padding:44px 10px;text-align:center;color:var(--ink3);font-size:13px}

/* ---------- pairing ---------- */
.pair{
  margin:0 0 18px;padding:16px;border:1px solid var(--warn);
  background:var(--warn-wash);border-radius:12px;
}
.pair h3{margin:0 0 6px;font-size:14px}
.pair p{margin:0;font-size:12.5px;color:var(--ink2)}
.pairrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.pairin{
  width:158px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);
  font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
}
.go{padding:10px 18px;border:0;border-radius:9px;background:var(--accent);color:#fff;
    font-size:13.5px;font-weight:600;cursor:pointer}

/* ---------- output ---------- */
.console{flex:none;background:var(--surface);border-top:1px solid var(--line)}
.cbar{display:flex;align-items:center;gap:12px;padding:7px 18px;border-bottom:1px solid var(--line)}
.ctitle{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.log{
  margin:0;padding:9px 18px 12px;height:132px;overflow-y:auto;background:var(--sunken);
  font-family:var(--mono);font-size:11.5px;line-height:1.6;
}
.line{display:flex;gap:11px;padding:1px 0}
.lt{color:var(--ink3);flex:none}
.ln{font-weight:700}
.l-ok{color:var(--ok)} .l-bad{color:var(--stop)} .l-run{color:var(--accent)}
.lb{color:var(--ink2);white-space:pre-wrap}
.idle{color:var(--ink3);font-style:italic}

/* ---------- footer ---------- */
.credit{
  flex:none;padding:7px 18px;text-align:center;font-size:10.5px;color:var(--ink3);
  background:var(--surface);border-top:1px solid var(--line);
}
.credit strong{color:var(--ink2);font-weight:600}
.credit a{color:var(--ink3)}

@media (max-width:720px){
  .facts{width:100%;margin-left:0;gap:12px}
  .fv{max-width:120px}
  .log{height:104px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="mark">AJ</div>
    <div><div class="bname">AJ Connect</div><span class="bsub">Panel</span></div>
  </div>

  <div class="facts">
    <span class="pill" id="pill"><span class="dot"></span><span id="pillText">Looking&hellip;</span></span>
    <div class="fact"><span class="fk">Revit</span><span class="fv" id="fRevit">-</span></div>
    <div class="fact"><span class="fk">Model</span><span class="fv" id="fModel">-</span></div>
    <div class="fact"><span class="fk">Active view</span><span class="fv" id="fView">-</span></div>
    <div class="fact"><span class="fk">Version</span><span class="fv" id="fVer">-</span></div>
  </div>
</header>

<div class="bar">
  <div class="seek">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" style="color:var(--ink3);flex:none">
      <circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4L14 14" stroke-linecap="round"/>
    </svg>
    <input id="seek" type="search" placeholder="Search tools" aria-label="Search tools">
  </div>
  <button class="mini" id="recheck" type="button">Reconnect</button>
  <button class="mini" id="refreshTools" type="button">Check for new tools</button>
  <button class="mini danger" id="moreBtn" type="button" title="Unlink options">&#8942;</button>
</div>

<main class="main" id="main">
  <div class="pair" id="pairCard" style="display:none">
    <h3>Link this browser to Revit</h3>
    <p>In Revit open <b>AJ Connect</b>, tick <b>Let my website run tools in this Revit</b>, and type the 6-character code it shows.</p>
    <div class="pairrow">
      <input class="pairin" id="pairInput" type="text" maxlength="6" autocomplete="off" spellcheck="false" placeholder="ABC123">
      <button class="go" id="pairBtn" type="button">Link</button>
      <span id="pairMsg" style="font-size:12.5px"></span>
    </div>
  </div>

  <div id="groups"><div class="empty">Loading tools&hellip;</div></div>
</main>

<section class="console">
  <div class="cbar">
    <span class="ctitle">Output</span>
    <span style="font-size:11.5px;color:var(--ink3);margin-right:auto" id="srcLine"></span>
    <button class="mini" id="clearLog" type="button">Clear</button>
  </div>
  <div class="log" id="log" role="log" aria-live="polite"></div>
</section>

<footer class="credit">
  Created &amp; All Rights Reserved @ <strong>Ajmal P.S.</strong> &nbsp;&middot;&nbsp;
  <a href="/aj-connector/">About AJ Connect</a>
</footer>

<script>
/* AJ Connect Panel.

   Talks to the connector on THIS computer at http://localhost:<port>/. That address does not exist
   outside this machine, so this page can never reach anyone else's Revit - not by a rule, but
   because a local address is not routable. Same reason it cannot work from a phone.

   Four states, each said plainly rather than collapsed into "error":
     not found (either not running, or website control switched off - the browser refuses to say
     which, so both are named) / found but not linked / linked and ready / linked but no model open.

   Signature checking is NOT done here and is not implied. It happens inside AJ Connect, which is the
   only place it means anything. */
(function () {
  var TOKEN_KEY = "ajconnect.token", PORT_KEY = "ajconnect.port";
  var FIRST = 48230, LAST = 48249;

  var token = null, port = null, ready = false, tools = [];
  try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {}

  function $(id) { return document.getElementById(id); }
  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }

  function now() {
    var d = new Date();
    return [d.getHours(), d.getMinutes(), d.getSeconds()]
      .map(function (v) { return String(v).padStart(2, "0"); }).join(":");
  }

  function log(name, kind, body) {
    var idle = $("log").querySelector(".idle");
    if (idle) idle.remove();

    var mark = kind === "run" ? "·" : kind === "ok" ? "OK" : "X";
    var row = document.createElement("div");
    row.className = "line";
    row.innerHTML = '<span class="lt">' + now() + '</span><span><span class="ln l-' + kind + '">' +
                    mark + " " + esc(name) + "</span>" + (body ? '<div class="lb"></div>' : "") + "</span>";
    if (body) row.querySelector(".lb").textContent = body;
    $("log").appendChild(row);
    $("log").scrollTop = $("log").scrollHeight;
    return row;
  }

  function ask(path, o) {
    o = o || {};
    var c = window.AbortController ? new AbortController() : null;
    if (c) setTimeout(function () { c.abort(); }, o.timeout || 2500);

    var headers = { "Content-Type": "application/json" };
    if (token) headers["X-AJ-Token"] = token;

    return fetch("http://localhost:" + (o.port || port) + path, {
      method: o.method || "GET",
      headers: headers,
      body: o.body ? JSON.stringify(o.body) : undefined,
      signal: c ? c.signal : undefined
    });
  }

  function setPill(cls, textValue) {
    $("pill").className = "pill " + cls;
    $("pillText").textContent = textValue;
  }

  function clearFacts() {
    ["fRevit", "fModel", "fView", "fVer"].forEach(function (id) { $(id).textContent = "-"; });
    $("srcLine").textContent = "";
  }

  /* ---------- tools ---------- */

  function renderTools() {
    var q = ($("seek").value || "").trim().toLowerCase();
    var hits = tools.filter(function (t) {
      return !q || (t.name || "").toLowerCase().indexOf(q) >= 0 ||
                   (t.description || "").toLowerCase().indexOf(q) >= 0 ||
                   (t.panel || "").toLowerCase().indexOf(q) >= 0;
    });

    var host = $("groups");

    if (!tools.length) {
      host.innerHTML = '<div class="empty">' +
        (ready ? "No tools published yet." : "Connect to see the tools.") + "</div>";
      return;
    }
    if (!hits.length) { host.innerHTML = '<div class="empty">Nothing matches that.</div>'; return; }

    var panels = [];
    hits.forEach(function (t) { if (panels.indexOf(t.panel || "Tools") < 0) panels.push(t.panel || "Tools"); });
    panels.sort();

    host.innerHTML = panels.map(function (p) {
      var cards = hits.filter(function (t) { return (t.panel || "Tools") === p; }).map(function (t) {
        var i = tools.indexOf(t);
        return '<button type="button" class="tool" data-live="' + (ready ? "1" : "0") + '" data-i="' + i + '"' +
               (ready ? "" : " disabled") + ">" +
               '<span class="tname">' + esc(t.name) + "</span>" +
               '<span class="tdesc">' + esc(t.description || "") + "</span></button>";
      }).join("");
      return '<h2 class="gname">' + esc(p) + '</h2><div class="grid">' + cards + "</div>";
    }).join("");

    if (ready) {
      Array.prototype.forEach.call(host.querySelectorAll(".tool"), function (b) {
        b.addEventListener("click", function () { run(tools[+b.getAttribute("data-i")], b); });
      });
    }
  }

  function loadTools() {
    if (!port) return Promise.resolve();
    return ask("/api/tools").then(function (r) { return r.json(); })
      .then(function (j) { tools = j.tools || []; renderTools(); })
      .catch(function () {});
  }

  function run(tool, button) {
    if (!ready) return;
    button.disabled = true;
    var pending = log(tool.name, "run", "");

    ask("/api/run", { method: "POST", body: { toolId: tool.id }, timeout: 95000 })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        pending.remove();
        log(tool.name, j.success ? "ok" : "bad", j.message || "");
        status();
      })
      .catch(function () {
        pending.remove();
        log(tool.name, "bad", "Lost contact with Revit. Is it still open and connected?");
        ready = false; setPill("bad", "Lost connection"); renderTools();
      })
      .then(function () { button.disabled = false; });
  }

  /* ---------- connection ---------- */

  function find() {
    var ports = [], remembered = null;
    try { remembered = localStorage.getItem(PORT_KEY); } catch (e) {}
    if (remembered) ports.push(+remembered);
    for (var p = FIRST; p <= LAST; p++) if (+remembered !== p) ports.push(p);

    var done = false;
    return new Promise(function (resolve) {
      var left = ports.length;
      ports.forEach(function (p) {
        ask("/api/tools", { port: p }).then(function (r) {
          if (done) return;
          if (r.status === 200 || r.status === 401) {
            done = true;
            try { localStorage.setItem(PORT_KEY, String(p)); } catch (e) {}
            resolve({ port: p, status: r.status });
          }
        }).catch(function () {}).then(function () {
          if (--left === 0 && !done) resolve(null);
        });
      });
      if (!ports.length) resolve(null);
    });
  }

  function status() {
    if (!port || !ready) return Promise.resolve();
    return ask("/api/status", { timeout: 95000 }).then(function (r) { return r.json(); }).then(function (s) {
      $("fRevit").textContent = s.revit || "-";
      $("fModel").textContent = s.model || "(none open)";
      $("fModel").title = s.model || "";
      $("fView").textContent = s.view || "-";
      $("fView").title = s.view || "";
      $("fVer").textContent = "v" + (s.version || "?");
      $("srcLine").textContent = s.source ? "Tools from " + s.source : "";

      if (s.modelOpen) setPill("ok", "Connected");
      else setPill("warn", "No model open in Revit");
    }).catch(function () {});
  }

  function connect() {
    setPill("", "Looking…");
    return find().then(function (found) {
      if (!found) {
        ready = false; port = null; tools = [];
        $("pairCard").style.display = "none";
        clearFacts();
        setPill("bad", "Not connected");
        $("groups").innerHTML = '<div class="empty">AJ Connect is not running on this computer,<br>' +
          'or &ldquo;Let my website run tools&rdquo; is switched off in it.<br><br>' +
          'Open <b>AJ Connect</b> in Revit, press <b>Connect</b>, then press Reconnect above.</div>';
        return;
      }

      port = found.port;

      if (found.status === 401) {
        ready = false;
        $("pairCard").style.display = "block";
        clearFacts();
        setPill("warn", "Found — not linked");
        renderTools();
        return;
      }

      ready = true;
      $("pairCard").style.display = "none";
      return loadTools().then(status);
    });
  }

  /* ---------- actions ---------- */

  $("recheck").addEventListener("click", connect);
  $("seek").addEventListener("input", renderTools);
  $("clearLog").addEventListener("click", function () {
    $("log").innerHTML = '<div class="line idle">Waiting — click a tool above.</div>';
  });

  $("pairBtn").addEventListener("click", function () {
    var code = ($("pairInput").value || "").trim().toUpperCase();
    if (code.length !== 6) { $("pairMsg").textContent = "The code is 6 characters."; $("pairMsg").style.color = "var(--stop)"; return; }

    $("pairMsg").textContent = "Linking…"; $("pairMsg").style.color = "";
    ask("/api/pair", { method: "POST", body: { code: code } })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok || !res.j.token) {
          $("pairMsg").textContent = res.j.message || "That did not work.";
          $("pairMsg").style.color = "var(--stop)";
          return;
        }
        token = res.j.token;
        try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
        $("pairMsg").textContent = "";
        log("Browser linked", "ok", "");
        connect();
      })
      .catch(function () { $("pairMsg").textContent = "Could not reach AJ Connect."; $("pairMsg").style.color = "var(--stop)"; });
  });

  $("refreshTools").addEventListener("click", function () {
    if (!ready) { log("Check for new tools", "bad", "Not connected."); return; }
    var pending = log("Check for new tools", "run", "");
    ask("/api/refresh", { method: "POST", body: {}, timeout: 30000 })
      .then(function (r) { return r.json(); })
      .then(function (j) { pending.remove(); log("Check for new tools", j.success ? "ok" : "bad", j.message || ""); return loadTools(); })
      .catch(function () { pending.remove(); log("Check for new tools", "bad", "Could not reach AJ Connect."); });
  });

  // Tucked behind a menu on purpose: unlinking is rare, and a button that stops everything should
  // not sit next to the ones used all day.
  $("moreBtn").addEventListener("click", function () {
    var choice = window.prompt(
      "Type a number:\n\n" +
      "1  Forget this browser (clears the link here only)\n" +
      "2  Switch website control off (stops every browser; can only be turned back on inside Revit)\n");

    if (choice === "1") {
      try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
      token = null; ready = false;
      log("This browser forgotten", "ok", "AJ Connect itself is untouched.");
      connect();
    } else if (choice === "2") {
      if (!ready) { log("Switch off", "bad", "Not connected."); return; }
      ask("/api/unpair", { method: "POST", body: {}, timeout: 10000 })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          log("Website control", j.success ? "ok" : "bad", j.message || "");
          try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
          token = null; ready = false;
          connect();
        })
        .catch(function () { log("Website control", "bad", "Could not reach AJ Connect."); });
    }
  });

  document.addEventListener("visibilitychange", function () { if (!document.hidden && !ready) connect(); });

  $("log").innerHTML = '<div class="line idle">Waiting — click a tool above.</div>';
  connect();
})();
</script>
</body>
</html>
