name: checks

# The site deploys straight from main with no build step, so a mistake is live
# the moment it merges. These run before that happens. Every page, the home page
# included, is a hand-written HTML file; there is nothing to build.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # Pinned, not ubuntu-latest. In November 2026 ubuntu-latest became 26.04,
    # and Playwright 1.56.1 cannot install Chromium there ("Playwright does not
    # support chromium on ubuntu26.04-x64"), so every run failed before a single
    # browser check ran. Move this on together with the Playwright version.
    runs-on: ubuntu-24.04
    # The job itself takes about three minutes. The budget is for the Chromium
    # download in the middle of it, which is usually quick and occasionally is
    # not: on 2026-10-27 it ran past ten minutes and the job was cancelled with
    # every check before it already green, which reads like a failure and is
    # not one. Twenty is room for a slow mirror, not room for a hang.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Static checks
        run: python3 tools/check_site.py

      # The bar, the phone menu and the footer are written into every page by
      # one script. A link added to ten of them and forgotten on the eleventh is
      # invisible until somebody lands on the eleventh, so the build fails instead.
      - name: Chrome is in sync on every page
        run: python3 tools/sync_chrome.py --check

      # The visible years compute themselves in app.js; these are the ones a
      # crawler reads without running any JavaScript, so they live in the file
      # and can go stale. Fails the build rather than waiting to be noticed.
      - name: Years of experience are current
        run: python3 tools/update_years.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Browser checks
        run: node tools/check_browser.mjs
