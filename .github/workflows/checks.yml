name: checks

# The site deploys straight from main with no build step, so a mistake is live
# the moment it merges. These run before that happens. (The home page is the
# one built file: its source is landing/, and the check below keeps the two in
# step.)
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Static checks
        run: python3 tools/check_site.py

      # The visible years compute themselves in app.js; these are the ones a
      # crawler reads without running any JavaScript, so they live in the file
      # and can go stale. Fails the build rather than waiting to be noticed.
      - name: Years of experience are current
        run: python3 tools/update_years.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The home page is built from landing/ and the output is committed, since
      # nothing builds on deploy. Rebuild it and fail if the committed files are
      # not what the source produces - an edit to landing/src that was never
      # built would otherwise pass every check and never reach the site.
      - name: Home page build is current
        working-directory: landing
        run: |
          npm ci --no-audit --no-fund
          npm run build
          if [ -n "$(git status --porcelain -- ../index.html ../assets/home)" ]; then
            git status --short -- ../index.html ../assets/home
            echo "::error::index.html or assets/home/ is out of date with landing/. Run: cd landing && npm install && npm run build - then commit the result."
            exit 1
          fi

      - name: Install Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Browser checks
        run: node tools/check_browser.mjs
