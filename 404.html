<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Ajmal P.S</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" id="metaTheme" content="#f2f4f8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>
(function(){
  var d = document.documentElement;
  var t = null;
  try{ t = localStorage.getItem("ajps-theme"); }catch(e){}
  if(t !== "dark" && t !== "light"){
    t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  d.setAttribute("data-theme", t);
  var m = document.getElementById("metaTheme");
  if(m) m.setAttribute("content", t === "dark" ? "#0c0e13" : "#f2f4f8");
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#1d1d1f; --muted:#6e6e73; --link:#0071e3;
  --bg:linear-gradient(180deg,#f7f9fc 0%,#eff2f8 100%);
  --hairline:#d2d2d7;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --ink:#f5f5f7; --muted:#a1a1a6; --link:#2997ff;
  --bg:linear-gradient(180deg,#0c0e13 0%,#0e1118 100%);
  --hairline:#2b2f38;
  color-scheme:dark;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink);
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px; text-align:center; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px}
.mark{
  width:60px;height:60px;margin:0 auto 34px;
  border:3px solid var(--link);border-radius:15px;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:23px;color:var(--link);
}
.code{
  font-size:clamp(72px,16vw,128px); line-height:1; font-weight:700; letter-spacing:-.045em;
  background:linear-gradient(96deg,#00c8ff 0%,#2563eb 48%,#7c3aed 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
h1{font-size:clamp(24px,4vw,34px);letter-spacing:-.02em;margin-top:18px;font-weight:650}
p{color:var(--muted);margin-top:14px;font-size:17px}
.btn{
  display:inline-block;margin-top:34px;
  background:var(--link);color:#fff;font-weight:600;font-size:16px;
  padding:14px 30px;border-radius:100px;text-decoration:none;
  transition:transform .25s cubic-bezier(.16,1,.3,1),opacity .25s;
}
.btn:hover{transform:translateY(-2px);opacity:.92}
.links{margin-top:30px;padding-top:26px;border-top:1px solid var(--hairline);
  display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.links a{color:var(--muted);text-decoration:none;font-size:15px}
.links a:hover{color:var(--link)}
:where(a):focus-visible{outline:2px solid var(--link);outline-offset:3px;border-radius:8px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">AJ</div>
    <div class="code">404</div>
    <h1>This page does not exist.</h1>
    <p>The link may be old, or the address mistyped. Everything lives on one page &mdash; head back and you will find it.</p>
    <a class="btn" href="/">Back to ajmalps.com</a>
    <div class="links">
      <a href="/#about">About</a>
      <a href="/#experience">Experience</a>
      <a href="/#projects">Work</a>
      <a href="/#ajtools">AJ-Tools</a>
      <a href="/#contact">Contact</a>
    </div>
  </div>
</body>
</html>
